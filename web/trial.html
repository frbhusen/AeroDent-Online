<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b2942" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>AeroDent</title>
</head>

<body class="trial-page">
    <main class="online-login-screen trial-screen">
        <div class="trial-card online-login-card">
            <div class="trial-card-top">
                <a class="trial-back" href="/" data-i18n="trialBackToSignIn">Back to sign in</a>
                <button type="button" class="button button-ghost trial-lang" id="trialLangBtn">English</button>
            </div>

            <div class="brand-mark"><img src="icons/icon-192.png" alt="AeroDent"></div>
            <p class="eyebrow" data-i18n="trialEyebrow">14-day free trial</p>
            <h1 data-i18n="trialTitle">Request your AeroDent trial</h1>
            <p class="muted" data-i18n="trialSubtitle">Leave your details and we will contact you to set up your clinic.</p>

            <form id="trialForm" class="trial-form" novalidate>
                <div class="field">
                    <label for="trialName" data-i18n="trialName">Full name</label>
                    <input id="trialName" name="name" autocomplete="name" maxlength="120" required>
                    <p class="field-error" data-error-for="name" role="alert"></p>
                </div>
                <div class="field">
                    <label for="trialPhone" data-i18n="trialPhone">Phone number</label>
                    <input id="trialPhone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" dir="ltr" required>
                    <p class="field-error" data-error-for="phone" role="alert"></p>
                </div>
                <div class="field">
                    <label for="trialEmail" data-i18n="trialEmail">Email</label>
                    <input id="trialEmail" name="email" type="email" inputmode="email" autocomplete="email" maxlength="255" dir="ltr" required>
                    <p class="field-error" data-error-for="email" role="alert"></p>
                </div>
                <div class="field">
                    <label for="trialMessage" data-i18n="trialMessage">Message (optional)</label>
                    <textarea id="trialMessage" name="message" rows="4" maxlength="1000"></textarea>
                    <p class="field-hint"><span id="trialMessageCount">0</span> / 1000</p>
                    <p class="field-error" data-error-for="message" role="alert"></p>
                </div>
                <div class="trial-honeypot" aria-hidden="true">
                    <label for="trialWebsite">Website</label>
                    <input id="trialWebsite" name="website" tabindex="-1" autocomplete="off">
                </div>
                <p id="trialFormError" class="login-error" role="alert"></p>
                <button id="trialSubmit" class="button button-primary full" type="submit">
                    <span data-i18n="trialSubmit">Request trial</span>
                </button>
            </form>

            <div id="trialSuccess" class="trial-success hidden" role="status">
                <div class="trial-success-icon" aria-hidden="true">✓</div>
                <h2 data-i18n="trialSuccessTitle">Request received</h2>
                <p class="muted" data-i18n="trialSuccessBody">Thank you. We will contact you soon to set up your 14-day trial.</p>
                <a class="button button-primary full" href="/" data-i18n="trialBackToSignIn">Back to sign in</a>
            </div>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script src="js/trial.js"></script>
</body>

</html>
