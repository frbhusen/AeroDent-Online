name: Build Windows AeroDent installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r standalone/requirements.txt

      - name: Build standalone application
        run: python -m standalone.build --zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Refresh command paths
        run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Create Windows installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" "standalone\AeroDent.iss"

      - name: Upload installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: AeroDent-Windows
          if-no-files-found: error
          path: |
            dist/AeroDent-Setup.exe
            dist/AeroDent-windows.zip
